<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>30週年校慶 AR 任務</title>
    <style>
        body {
            font-family: 'Helvetica', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            text-align: center;
            padding: 0; margin: 0; height: 100vh;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            overflow: hidden;
        }
        #cover-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #000000 0%, #434343 100%);
            z-index: 999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: transform 0.8s ease-in-out;
        }
        .start-btn {
            padding: 20px 40px; font-size: 24px; font-weight: bold; color: #fff;
            background: linear-gradient(to right, #ff9068, #ff4b1f);
            border: none; border-radius: 50px;
            box-shadow: 0 5px 15px rgba(255, 75, 31, 0.6);
            cursor: pointer; animation: pulse 2s infinite;
        }
        #location-menu { opacity: 0; transition: opacity 1s ease-in-out; pointer-events: none; }
        .btn {
            display: block; width: 260px; padding: 15px; margin: 15px auto;
            background: rgba(255, 255, 255, 0.15); border: 2px solid white;
            color: white; text-decoration: none; border-radius: 30px;
            font-size: 18px; backdrop-filter: blur(5px);
        }
        .btn-nav { border-color: #ffd700; color: #ffd700; font-weight: bold; background: rgba(0, 0, 0, 0.3); }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
    <script>
        function startMission() {
            document.getElementById('cover-screen').style.transform = "translateY(-100%)";
            var menu = document.getElementById('location-menu');
            menu.style.opacity = "1";
            menu.style.pointerEvents = "auto";
        }
    </script>
</head>
<body>
    <div id="cover-screen">
        <h1 style="margin-bottom: 50px; font-size: 32px;">30週年校慶<br>AR 探索任務</h1>
        <button class="start-btn" onclick="startMission()">🚀 開始任務</button>
    </div>

    <div id="location-menu">
        <h2 style="margin-bottom: 30px;">請選擇模式：</h2>
        
        <a href="francis.html" class="btn">📍 聖方濟校園 (模擬)</a>
        <a href="paul.html" class="btn">📍 聖保祿校園 (模擬)</a>
        
        <a href="mission.html" class="btn btn-nav">🤔 我不肯定 / 戶外通用<br><span style="font-size:12px">(真實 GPS • 推薦)</span></a>
    </div>
    <div style="position: absolute; bottom: 20px; font-size: 12px; opacity: 0.6;">Powered by WebAR</div>
</body>
</html>
